[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "sfc-api"
version = "0.1.0"
description = "Flask API for the Smart Food Supply Chain & Surplus Redistribution System"
requires-python = ">=3.13"
dependencies = [
    "Flask~=3.1",
    "pydantic~=2.0",
    "python-dotenv~=1.0",
    "tzdata>=2025.1",
    "SQLAlchemy>=2.0,<2.1",
    "PyMySQL>=1.1,<1.2",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
    "pytest~=8.0",
    "ruff~=0.17",
    "black~=26.0",
    "mypy~=2.4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "C4", "RUF"]

[tool.black]
line-length = 100
target-version = ["py313"]

[tool.mypy]
python_version = "3.13"
mypy_path = "src"
packages = ["sfc_api"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
plugins = ["pydantic.mypy"]
